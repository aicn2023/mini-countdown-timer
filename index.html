<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简倒计时</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 60px 20px; background: #f7f7f7; color: #222; }
  h1 { font-size: 28px; margin-bottom: 10px; }
  p { color: #666; }
  #time { font-size: 72px; font-weight: bold; margin: 30px 0; letter-spacing: 4px; }
  input { width: 90px; font-size: 20px; padding: 8px; text-align: center; }
  button { font-size: 18px; padding: 10px 22px; margin: 6px; cursor: pointer; }
</style>
</head>
<body>
  <h1>极简倒计时</h1>
  <p>输入分钟数，点开始就行</p>
  <div>
    <input id="minutes" type="number" min="1" max="999" value="25"> 分钟
  </div>
  <div id="time">25:00</div>
  <div>
    <button id="startBtn">开始</button>
    <button id="pauseBtn">暂停</button>
    <button id="resetBtn">重置</button>
  </div>
  <script>
    let total = 25 * 60, left = total, timer = null;
    const timeEl = document.getElementById('time');
    const minEl = document.getElementById('minutes');
    function show() {
      const m = Math.floor(left / 60), s = left % 60;
      timeEl.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }
    document.getElementById('startBtn').onclick = () => {
      if (timer) return;
      if (left <= 0) left = parseInt(minEl.value || '25', 10) * 60;
      timer = setInterval(() => {
        left--;
        show();
        if (left <= 0) { clearInterval(timer); timer = null; alert('时间到！'); }
      }, 1000);
    };
    document.getElementById('pauseBtn').onclick = () => { clearInterval(timer); timer = null; };
    document.getElementById('resetBtn').onclick = () => {
      clearInterval(timer); timer = null;
      left = parseInt(minEl.value || '25', 10) * 60;
      show();
    };
    minEl.onchange = () => { left = parseInt(minEl.value || '25', 10) * 60; show(); };
    show();
  </script>
</body>
</html>
